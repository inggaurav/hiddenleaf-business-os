name: HiddenLeaf BusinessOS CI

on:
  push:
    branches: [master, stage-1-workdo-core-real-build, integration/hiddenleaf-v1, 'release/*']
  pull_request:
    branches: [master, stage-1-workdo-core-real-build, integration/hiddenleaf-v1, 'release/*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hiddenleaf_business_os
          POSTGRES_USER: hiddenleaf
          POSTGRES_PASSWORD: hiddenleaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiddenleaf -d hiddenleaf_business_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hiddenleaf_business_os
      DB_USERNAME: hiddenleaf
      DB_PASSWORD: hiddenleaf
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, dom, fileinfo, pdo_pgsql, pdo_sqlite, redis, gd, zip
          coverage: none

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Create application environment
        run: cp .env.example .env

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Generate application key
        run: php artisan key:generate

      - name: Audit Composer dependencies
        run: composer audit

      - name: Install frontend dependencies
        run: npm ci

      - name: Migrate and seed PostgreSQL
        run: php artisan migrate:fresh --seed

      - name: Verify PostgreSQL and Redis integration
        run: php artisan test --configuration phpunit.pgsql.xml

      - name: Execute test suite
        run: php artisan test

      - name: Validate coarse WorkDo capability registry
        run: composer parity:validate

      - name: Validate evidence-backed route/controller/test registry
        run: php artisan parity:validate

      - name: Validate forensic routes and Inertia contracts
        run: composer forensic:validate

      - name: Scan release sources
        run: composer release:scan

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Verify PHP code style
        run: ./vendor/bin/pint --test

      - name: Type-check frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
